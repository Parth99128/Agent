version: '3.8'

services:
  # PostgreSQL for persistent registry
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oai_network
      POSTGRES_USER: oai
      POSTGRES_PASSWORD: oai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oai -d oai_network"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching/sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Registry Service
  registry:
    build:
      context: .
      dockerfile: docker/Dockerfile.registry
    ports:
      - "8081:8081"
    environment:
      - REGISTRY_DATABASE_URL=postgresql://oai:oai@postgres:5432/oai_network
      - REGISTRY_HOST=0.0.0.0
      - REGISTRY_PORT=8081
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: python -m oai_network.registry.server

  # Gateway Service
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8080
      - REGISTRY_URL=http://registry:8081
      - PYTHONPATH=/app
    depends_on:
      - registry
    volumes:
      - ./src:/app/src
    command: python -m oai_network.gateway.server

  # Translator Agent
  translator:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    ports:
      - "8001:8001"
    environment:
      - AGENT_NAME=Translator Agent
      - AGENT_PORT=8001
      - REGISTRY_URL=http://registry:8081
      - PYTHONPATH=/app
    depends_on:
      - registry
    volumes:
      - ./src:/app/src
    command: python -m oai_network.examples.translator_agent

  # Summarizer Agent
  summarizer:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    ports:
      - "8002:8002"
    environment:
      - AGENT_NAME=Summarizer Agent
      - AGENT_PORT=8002
      - REGISTRY_URL=http://registry:8081
      - PYTHONPATH=/app
    depends_on:
      - registry
    volumes:
      - ./src:/app/src
    command: python -m oai_network.examples.summarizer_agent

  # Code Analysis Agent
  code-analysis:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    ports:
      - "8003:8003"
    environment:
      - AGENT_NAME=Code Analysis Agent
      - AGENT_PORT=8003
      - REGISTRY_URL=http://registry:8081
      - PYTHONPATH=/app
    depends_on:
      - registry
    volumes:
      - ./src:/app/src
    command: python -m oai_network.agents.code_analysis_agent

  # Prometheus for metrics collection (Stage 12)
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana for visualization (Stage 12)
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: