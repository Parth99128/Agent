name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          ruff check src/

      - name: Run tests
        run: |
          python -m pytest src/oai_network/tests/ -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          flags: unittests

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build registry image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.registry
          push: false
          tags: oai-network/registry:latest
          load: true

      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: false
          tags: oai-network/gateway:latest
          load: true

      - name: Build agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.agent
          push: false
          tags: oai-network/agent:latest
          load: true

      - name: Test docker-compose
        run: |
          cd docker
          docker-compose up -d
          sleep 10
          curl -f http://localhost:8081/health || exit 1
          curl -f http://localhost:8080/health || exit 1
          docker-compose down

  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.registry
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/oai-network-registry:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/oai-network-gateway:latest

      - name: Build and push agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.agent
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/oai-network-agent:latest