[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oai-network"
version = "0.1.0"
description = "Open phonebook + rulebook + trust system for AI agents — discovery, identity, and delegation over MCP & A2A"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "OAI-Network Contributors"}]
keywords = ["ai", "agents", "mcp", "a2a", "discovery", "trust", "orchestration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "cryptography>=42.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
oai = "oai_network.cli:main"

[project.urls]
Homepage = "https://github.com/Parth99128/Agent"
Repository = "https://github.com/Parth99128/Agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
