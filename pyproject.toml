[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oai-network"
version = "0.1.0"
description = "Open phonebook + rulebook + trust system for AI agents — discovery, identity, and delegation over MCP & A2A"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "OAI-Network Contributors"}]
keywords = ["ai", "agents", "mcp", "a2a", "discovery", "trust", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "cryptography>=42.0",
    "rich>=13.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "fastapi>=0.111",
    "websockets>=12.0",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]
mcp = [
    "mcp>=2.0.0",
]
ollama = [
    "ollama>=0.3.0",
]
agents = [
    "bandit>=1.7",
    "pylint>=3.0",
]
observability = [
    "prometheus-client>=0.19",
    "structlog>=24.0",
]
all = [
    "mcp>=2.0.0",
    "ollama>=0.3.0",
    "bandit>=1.7",
    "pylint>=3.0",
    "prometheus-client>=0.19",
    "structlog>=24.0",
]
demo = [
    "httpx>=0.27",
]

[project.scripts]
oai = "oai_network.cli:main"
oai-registry = "oai_network.registry.server:main"
oai-gateway = "oai_network.gateway.server:main"
oai-translator = "oai_network.examples.translator_agent:main"
oai-summarizer = "oai_network.examples.summarizer_agent:main"
oai-code-analysis = "oai_network.agents.code_analysis_agent:main"

[project.urls]
Homepage = "https://github.com/Parth99128/Agent"
Repository = "https://github.com/Parth99128/Agent"
Documentation = "https://github.com/Parth99128/Agent/wiki"
Changelog = "https://github.com/Parth99128/Agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/Parth99128/Agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
ignore = ["__pycache__", ".git", "venv", ".venv"]
ignore-patterns = ["^\\.#"]
ignore-paths = [
    ".*/__pycache__/.*",
    ".*/.git/.*",
    ".*/venv/.*",
    ".*/.venv/.*",
    ".*/site-packages/.*",
    ".*/dist-packages/.*",
    ".*/examples/.*",
]


[tool.coverage.run]
source = ["src/oai_network"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
